<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Moffatt Township</title>
  <link rel="icon" href="/assets/seal.webp" type="image/webp">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <a class="skip-link" href="#editor">Skip to editor</a>
  <header class="site-header">
    <div class="wrap header-top">
      <div class="brand"><img src="/assets/seal.webp" alt="" width="56" height="56"><span><span class="brand-name">Website Admin</span><span class="brand-sub">Moffatt Township</span></span></div>
      <div class="admin-actions">
        <a class="btn dark" href="/" target="_blank" rel="noopener noreferrer">View site<span class="sr-only"> (opens in a new tab)</span></a>
        <button class="btn solid-green" id="save" type="button">Save changes</button>
      </div>
    </div>
  </header>
  <div class="wrap admin-layout">
    <nav aria-label="Sections"><ul id="sections" class="section-list"></ul></nav>
    <main id="editor" tabindex="-1"></main>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
