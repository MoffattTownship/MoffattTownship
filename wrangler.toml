name = "moffatt-township"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker sees these paths first; everything else is served as a static file.
run_worker_first = ["/api/*", "/files/*", "/admin", "/admin/*"]
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "moffatt-township"

[vars]
# From Zero Trust > Access > Applications > (your admin app)
ACCESS_TEAM_DOMAIN = "divine-mouse-8dda.cloudflareaccess.com"
ACCESS_AUD = "d63fd3cb31b4e6d983a6d8092c28ea40f8cbcee15c4222b4d2fde91d37625bf5"
